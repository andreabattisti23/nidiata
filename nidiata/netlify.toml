[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# Le API (/api/*) sono gestite dalla funzione netlify/functions/api.mts (config.path).
# Tutto il resto torna a index.html così TanStack Router gestisce le pagine.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
